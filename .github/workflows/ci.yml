name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check migration versions
        run: python3 scripts/check_migration_versions.py

      - name: Compile and package without running tests
        working-directory: resource-tracker
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests -DskipITs

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: resource-tracker-jar
          path: resource-tracker/target/resource-tracker-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Lightsail
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: resource-tracker-production
      cancel-in-progress: false

    steps:
      - name: Checkout migration files and Maven configuration
        uses: actions/checkout@v4

      - name: Set up Java for Flyway migration
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: resource-tracker-jar
          path: deploy

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/resource-tracker-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/resource-tracker-deploy
          chmod 600 ~/.ssh/known_hosts

      - name: Validate and apply production database migrations
        working-directory: resource-tracker
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DB_NAME: ${{ secrets.LIGHTSAIL_DB_NAME }}
          DB_USER: ${{ secrets.LIGHTSAIL_DB_USER }}
          DB_PASSWORD: ${{ secrets.LIGHTSAIL_DB_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$LIGHTSAIL_HOST" || -z "$LIGHTSAIL_USER" ]]; then
            echo "ERROR: Lightsail SSH GitHub secrets are not configured."
            exit 1
          fi

          if [[ -z "$DB_NAME" || -z "$DB_USER" || -z "$DB_PASSWORD" ]]; then
            echo "ERROR: Production database GitHub secrets are not configured."
            exit 1
          fi

          SSH_OPTS=(
            -i ~/.ssh/resource-tracker-deploy
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          SSH_CONTROL_SOCKET="$RUNNER_TEMP/lightsail-db-tunnel.sock"

          ssh -fN -M "${SSH_OPTS[@]}" \
            -S "$SSH_CONTROL_SOCKET" \
            -L 3307:127.0.0.1:3306 \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST"

          cleanup() {
            ssh -S "$SSH_CONTROL_SOCKET" -O exit "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" 2>/dev/null || true
            rm -f "$SSH_CONTROL_SOCKET"
          }
          trap cleanup EXIT

          ./mvnw --batch-mode --no-transfer-progress \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3307/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -Dflyway.user="$DB_USER" \
            -Dflyway.password="$DB_PASSWORD" \
            flyway:migrate flyway:validate

      - name: Upload application JAR
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp \
            -i ~/.ssh/resource-tracker-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy/resource-tracker-0.0.1-SNAPSHOT.jar \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/resource-tracker.jar"

      - name: Deploy and verify application
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -i ~/.ssh/resource-tracker-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/opt/resource-tracker"
          BACKUP_DIR="$APP_DIR/backups"
          NEW_JAR="/tmp/resource-tracker.jar"
          APP_JAR="$APP_DIR/app.jar"
          BACKUP_JAR="$BACKUP_DIR/app-$(date -u +%Y%m%d-%H%M%S).jar"

          trap 'rm -f "$NEW_JAR"' EXIT

          if [[ ! -s "$NEW_JAR" ]]; then
            echo "ERROR: Uploaded JAR is missing or empty."
            exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          if [[ -f "$APP_JAR" ]]; then
            cp -a "$APP_JAR" "$BACKUP_JAR"
            echo "Previous JAR backed up to $BACKUP_JAR"
          fi

          install -o resource-tracker -g resource-tracker \
            -m 0644 "$NEW_JAR" "$APP_DIR/app.jar.new"

          mv -f "$APP_DIR/app.jar.new" "$APP_JAR"

          systemctl enable resource-tracker.service
          systemctl restart resource-tracker.service

          echo "Waiting for application health..."

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo
              echo "Deployment successful."
              find "$BACKUP_DIR" -type f -name 'app-*.jar' -mtime +7 -delete
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: Health check failed. Rolling back..."

          if [[ -f "$BACKUP_JAR" ]]; then
            cp -a "$BACKUP_JAR" "$APP_JAR"
            systemctl restart resource-tracker.service
            echo "Previous application JAR restored."
          else
            systemctl stop resource-tracker.service
            echo "No previous JAR existed. Application stopped."
          fi

          journalctl -u resource-tracker.service -n 40 --no-pager || true
          exit 1
          REMOTE
