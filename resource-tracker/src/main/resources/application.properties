gg.jte.development-mode=true
spring.application.name=resource-tracker
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET}
app.security.access-ttl=30m
app.security.reset-token-ttl=${APP_SECURITY_RESET_TOKEN_TTL:PT1H}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${APP_MAIL_FROM:no-reply@resource-tracker.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Keep Swagger UI organized and compact by default.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

#database connection
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#flyway configuration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
