services:
  mysql:
    image: mysql:8.4
    container_name: resource-tracker-dbms
    environment:
      MYSQL_DATABASE: ${DB_NAME:-resource_tracker}
      MYSQL_USER: ${DB_USER:?Set DB_USER in resource-tracker/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in resource-tracker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in resource-tracker/.env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      timeout: 20s
      retries: 10
      interval: 5s
      start_period: 20s

  backend:
    build: .
    container_name: resource-tracker-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?Set APP_SECURITY_JWT_SECRET in resource-tracker/.env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-resource_tracker}
      DB_USER: ${DB_USER:?Set DB_USER in resource-tracker/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in resource-tracker/.env}

volumes:
  mysql_data: