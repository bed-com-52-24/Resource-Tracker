version: '3.8'
services:
  #databse
  mysql:
    image: mysql:latest
    container_name: resource-tracker-dbms
    environment:
      MYSQL_DATABASE: resource_tracker
      MYSQL_PASSWORD: 123456789
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10


  #backend
  backend:
    image: jeckman/resource-tracker-backend:v1
    container_name: resource-tracker-backend
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATABASE_URL: jdbc:mysql://mysql-db:3306/resource_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789

volumes:
  mysql_data: